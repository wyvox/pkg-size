name: 'pkg-size-action'
description: 'Report npm package size on pull-requests'
author: 'Hiroki Osame <hiroki.osame@gmail.com>'
branding:
  icon: 'git-pull-request'
  color: 'blue'
inputs:
  build-command:
    description: 'Command to build the package with'
  comment-report:
    description: 'Whether to comment the build size report on the PR or not: true, false'
  mode:
    description: 'Report mode: regression (default), head-only'
  display-size:
    description: 'What size to display. Comma delimited list for multiple: uncompressed (default), gzip, brotli:'
  unchanged-files:
    description: 'Whether to show unchanged files: show, collapse, hide'
  sort-by:
    description: 'Which property to sort by: delta (size difference), headSize, baseSize, path'
  sort-order:
    description: 'Sort order: desc, asc'
  hide-files:
    description: 'Glob pattern to hide files with'
  ignore-threshold:
    description: 'Minimum byte difference to consider a file as changed (default: 100)'
  strip-hash:
    description: 'Regular expression to strip hashes from file names for comparison. Files that differ only in their hash will be compared as the same file. Set to "false" to disable. Default matches common build tool hash patterns.'
  auto-collapse:
    description: 'Automatically collapse file rows into a <details> section when there are more than 20 files: true, false'
    default: 'true'
  paths:
    description: 'Optional newline-separated list of path prefixes to report on individually. Each entry can use a "Label: path/prefix" form to provide a friendly heading. When provided, the action emits one table per entry instead of a single combined table.'
runs:
  using: 'node20'
  main: 'dist/index.js'
